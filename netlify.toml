[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

# Ohne diese Regel gibt Netlify bei direktem Aufruf von z.B. /norm/123
# einen 404 zurück, weil physisch keine solche Datei existiert — React
# Router übernimmt das Routing erst, nachdem index.html geladen ist.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200